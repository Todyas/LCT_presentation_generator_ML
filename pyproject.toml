[project]
name = "lct-09-26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "openai>=3.16.2",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "docker: requires a real LibreOffice (soffice) binary; run inside the Docker image",
]
