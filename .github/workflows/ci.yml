name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check app tests alembic
      - run: uv run pytest -q -m "not docker"
      - name: Verify migrations from an empty database
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/slideops-ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build --tag slideops-backend:ci .
      - run: docker build --tag slideops-frontend:ci ./frontend
